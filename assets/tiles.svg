      <circle r="1.25" fill="#17689a"/>
    </g>
    <g id="pin-red">
      <circle r="6.2" fill="#fff8f5" stroke="#ba3030" stroke-width="2"/>
      <circle r="3.6" fill="none" stroke="#e27767" stroke-width="1.2"/>
      <circle r="1.25" fill="#ba3030"/>
    </g>
    <g id="pin-green">
      <circle r="6.2" fill="#f7fcf6" stroke="#25804d" stroke-width="2"/>
      <circle r="3.6" fill="none" stroke="#67aa78" stroke-width="1.2"/>
      <circle r="1.25" fill="#25804d"/>
    </g>

    <g id="bamboo-green">
      <rect x="-3.2" y="-11" width="6.4" height="22" rx="3" fill="#2e8a50"/>
      <path d="M-3 0H3" stroke="#e4f0c7" stroke-width="1.5"/>
      <path d="M0-9V9" stroke="#63b66d" stroke-width="1"/>
    </g>
    <g id="bamboo-red">
