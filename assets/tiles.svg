<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="tile-shell">
      <rect x="1" y="1" width="70" height="98" rx="8" fill="#fffdf5" stroke="#d8cfbb" stroke-width="2"/>
    </g>

    <g id="pin-blue">
