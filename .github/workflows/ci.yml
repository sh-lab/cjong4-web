name: CI

on:
  push:
    branches:
      - main
      - dev/initial
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCJ4_WEB_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  wasm:
    name: Wasm build
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: "6.0.2"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install emsdk
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build Wasm site
        run: EMSDK_DIR="$RUNNER_TEMP/emsdk" ./scripts/build-wasm.sh
