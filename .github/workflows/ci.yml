name: CI

on:
  push:
    branches:
      - main
      - dev/initial
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Check out cjong4
        uses: actions/checkout@v4
        with:
          repository: sh-lab/cjong4
          ref: a158c9f96ff85adb975a479a124a8f967d86f29a
          path: deps/cjong4

      - name: Check out cjong4-opponent
        uses: actions/checkout@v4
        with:
          repository: sh-lab/cjong4-opponent
          ref: 1a9b5e7baf5cf3da5c2e79a18a84f0191a49924d
          path: deps/cjong4-opponent

      - name: Check out cjong4-mjai
        uses: actions/checkout@v4
        with:
          repository: sh-lab/cjong4-mjai
          ref: ebc71646a372d3498effbdc09b08f62745df1fbc
          path: deps/cjong4-mjai

      - name: Install core dependency
        run: |
          cmake -S deps/cjong4 -B deps/core-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/deps/install"
          cmake --build deps/core-build --parallel
          cmake --install deps/core-build

      - name: Configure
        run: cmake -S . -B build -DCJ4_WEB_BUILD_TESTS=ON -DCJONG4_SOURCE_DIR= -DCJ4_OPPONENT_USE_SYSTEM_CJONG4=ON -DCMAKE_PREFIX_PATH="$PWD/deps/install" -DCJ4_WEB_OPPONENT_SOURCE_DIR="$PWD/deps/cjong4-opponent" -DCJ4_WEB_MJAI_SOURCE_DIR="$PWD/deps/cjong4-mjai"

      - name: Build
        run: cmake --build build --parallel

      - name: Test browser logic
        run: node --test tests/test_app.cjs

      - name: Test
        run: ctest --test-dir build --output-on-failure

  wasm:
    name: Wasm build
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: "6.0.2"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Check out cjong4
        uses: actions/checkout@v4
        with:
          repository: sh-lab/cjong4
          ref: a158c9f96ff85adb975a479a124a8f967d86f29a
          path: deps/cjong4

      - name: Check out cjong4-opponent
        uses: actions/checkout@v4
        with:
          repository: sh-lab/cjong4-opponent
          ref: 1a9b5e7baf5cf3da5c2e79a18a84f0191a49924d
          path: deps/cjong4-opponent

      - name: Check out cjong4-mjai
        uses: actions/checkout@v4
        with:
          repository: sh-lab/cjong4-mjai
          ref: ebc71646a372d3498effbdc09b08f62745df1fbc
          path: deps/cjong4-mjai

      - name: Install emsdk
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build Wasm site
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S deps/cjong4 -B deps/core-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/deps/install"
          cmake --build deps/core-build --parallel
          cmake --install deps/core-build
          # Emscripten searches packages only inside its cross-compilation roots.
          ./scripts/build-wasm.sh -DCJONG4_SOURCE_DIR= -DCJ4_OPPONENT_USE_SYSTEM_CJONG4=ON -DCMAKE_PREFIX_PATH="$PWD/deps/install" -DCMAKE_FIND_ROOT_PATH="$PWD/deps/install" -DCJ4_WEB_OPPONENT_SOURCE_DIR="$PWD/deps/cjong4-opponent" -DCJ4_WEB_MJAI_SOURCE_DIR="$PWD/deps/cjong4-mjai"
