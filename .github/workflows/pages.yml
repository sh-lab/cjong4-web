name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: "6.0.2"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Check out cjong4
        uses: actions/checkout@v4
        with:
          repository: sh-lab/cjong4
          ref: a158c9f96ff85adb975a479a124a8f967d86f29a
          path: deps/cjong4

      - name: Check out cjong4-opponent
        uses: actions/checkout@v4
        with:
          repository: sh-lab/cjong4-opponent
          ref: 1a9b5e7baf5cf3da5c2e79a18a84f0191a49924d
          path: deps/cjong4-opponent

      - name: Check out cjong4-mjai
        uses: actions/checkout@v4
        with:
          repository: sh-lab/cjong4-mjai
          ref: ebc71646a372d3498effbdc09b08f62745df1fbc
          path: deps/cjong4-mjai

      - name: Install emsdk
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build Wasm site
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S deps/cjong4 -B deps/core-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/deps/install"
          cmake --build deps/core-build --parallel
          cmake --install deps/core-build
          ./scripts/build-wasm.sh -DCJONG4_SOURCE_DIR= -DCJ4_OPPONENT_USE_SYSTEM_CJONG4=ON -DCMAKE_PREFIX_PATH="$PWD/deps/install" -DCJ4_WEB_OPPONENT_SOURCE_DIR="$PWD/deps/cjong4-opponent" -DCJ4_WEB_MJAI_SOURCE_DIR="$PWD/deps/cjong4-mjai"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build-wasm/site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
